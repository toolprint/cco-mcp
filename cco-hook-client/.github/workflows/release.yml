name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "cco-hook-client/**"
      - ".github/workflows/release.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: |
          cd cco-hook-client
          cargo test --verbose

      - name: Run clippy
        run: |
          cd cco-hook-client
          cargo clippy -- -D warnings

      - name: Check formatting
        run: |
          cd cco-hook-client
          cargo fmt --check

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: cco-hook-client-linux-x86_64
            configure_name: configure-claude-linux-x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: cco-hook-client-macos-x86_64
            configure_name: configure-claude-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: cco-hook-client-macos-aarch64
            configure_name: configure-claude-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: cco-hook-client-windows-x86_64.exe
            configure_name: configure-claude-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build binary
        run: |
          cd cco-hook-client
          cargo build --release --target ${{ matrix.target }}

      - name: Create binary artifacts
        shell: bash
        run: |
          cd cco-hook-client
          mkdir -p artifacts

          # Copy main binary
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp target/${{ matrix.target }}/release/cco-hook-client.exe artifacts/${{ matrix.name }}
            cp target/${{ matrix.target }}/release/configure-claude.exe artifacts/${{ matrix.configure_name }}
          else
            cp target/${{ matrix.target }}/release/cco-hook-client artifacts/${{ matrix.name }}
            cp target/${{ matrix.target }}/release/configure-claude artifacts/${{ matrix.configure_name }}
          fi

          # Create checksums
          cd artifacts
          if command -v shasum > /dev/null; then
            shasum -a 256 * > checksums.txt
          elif command -v sha256sum > /dev/null; then
            sha256sum * > checksums.txt
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: cco-hook-client/artifacts/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release/
          for target_dir in artifacts/*/; do
            target=$(basename "$target_dir")
            echo "Processing $target"
            cp "$target_dir"* release/
          done
          ls -la release/

      - name: Extract release notes
        id: extract_notes
        run: |
          # Extract version from tag
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

          # Try to extract release notes from CHANGELOG.md if it exists
          if [ -f cco-hook-client/CHANGELOG.md ]; then
            # Extract notes for this version (simplified approach)
            echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
            echo "## Release $VERSION" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "Cross-platform binaries for CCO Hook Client $VERSION" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "### Downloads" >> $GITHUB_OUTPUT
            echo "- **Linux (x86_64)**: cco-hook-client-linux-x86_64" >> $GITHUB_OUTPUT
            echo "- **macOS (x86_64)**: cco-hook-client-macos-x86_64" >> $GITHUB_OUTPUT
            echo "- **macOS (ARM64)**: cco-hook-client-macos-aarch64" >> $GITHUB_OUTPUT
            echo "- **Windows (x86_64)**: cco-hook-client-windows-x86_64.exe" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "### Installation" >> $GITHUB_OUTPUT
            echo '```bash' >> $GITHUB_OUTPUT
            echo '# Download and install (example for Linux)' >> $GITHUB_OUTPUT
            echo 'curl -fsSL -o cco-hook-client https://github.com/toolprint/cco-mcp/releases/download/v$VERSION/cco-hook-client-linux-x86_64' >> $GITHUB_OUTPUT
            echo 'chmod +x cco-hook-client' >> $GITHUB_OUTPUT
            echo 'sudo mv cco-hook-client /usr/local/bin/' >> $GITHUB_OUTPUT
            echo '' >> $GITHUB_OUTPUT
            echo '# Configure Claude Code' >> $GITHUB_OUTPUT
            echo './configure-claude-linux-x86_64' >> $GITHUB_OUTPUT
            echo '```' >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "RELEASE_NOTES=Release $VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: CCO Hook Client v${{ steps.extract_notes.outputs.VERSION }}
          body: ${{ steps.extract_notes.outputs.RELEASE_NOTES }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

      - name: Upload Release Assets
        run: |
          for asset in release/*; do
            if [ -f "$asset" ]; then
              asset_name=$(basename "$asset")
              echo "Uploading $asset_name"
              gh release upload ${{ github.ref_name }} "$asset" --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: |
          cd cco-hook-client
          cargo audit

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}

      - name: Run benchmarks
        run: |
          cd cco-hook-client
          # Run basic performance test
          cargo build --release
          echo '{"type":"PreToolUse","sessionId":"test","timestamp":"2024-01-01T00:00:00Z","tool":{"name":"TestTool","input":{}}}' | \
            timeout 5s ./target/release/cco-hook-client --dry-run || true

      - name: Binary size check
        run: |
          cd cco-hook-client
          size=$(stat -c%s target/release/cco-hook-client)
          echo "Binary size: $size bytes (~$((size / 1024 / 1024)) MB)"

          # Fail if binary is larger than 20MB
          if [ $size -gt 20971520 ]; then
            echo "❌ Binary size exceeds 20MB limit"
            exit 1
          else
            echo "✅ Binary size is acceptable"
          fi
