[package]
name = "cco-hook-client"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust-based hook client for CCO-MCP (Claude Code Oversight)"
license = "MIT"
repository = "https://github.com/toolprint/cco-mcp"
authors = ["CCO-MCP Team"]
keywords = ["claude", "hooks", "mcp", "oversight", "audit"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "cco-hook-client"
path = "src/main.rs"

[[bin]]
name = "configure-claude"
path = "src/bin/configure-claude.rs"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }

# HTTP client with connection pooling
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CLI parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Configuration
toml = "0.8"
dirs = "5.0"

# Utilities
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
which = "6.0"

# Async utilities
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"

# Signal handling
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = true
opt-level = 0

# Optimizations for dependencies in dev builds
[profile.dev.package."*"]
opt-level = 2

[features]
default = ["tls-native"]
tls-native = ["reqwest/native-tls"]
tls-rustls = ["reqwest/rustls-tls"]